name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Refresh EasyList rules (keeps bundled copy if download fails)
        run: python3 scripts/convert_easylist.py SecureBrowser/Resources/Rules || echo "using bundled rules"
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SecureBrowser.xcodeproj -scheme SecureBrowser \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SecureBrowser.app Payload/
          zip -qry SecureBrowser.ipa Payload
          ls -lh SecureBrowser.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SecureBrowser-unsigned-ipa
          path: SecureBrowser.ipa
