name: SecureBrowser
options:
  bundleIdPrefix: com.example.securebrowser
  deploymentTarget:
    iOS: "15.0"
targets:
  SecureBrowser:
    type: application
    platform: iOS
    sources:
      - path: SecureBrowser/Sources
      - path: SecureBrowser/Resources/Rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.securebrowser
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: セキュアブラウザ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: ja
        DEVELOPMENT_LANGUAGE: ja
        CODE_SIGN_STYLE: Manual
